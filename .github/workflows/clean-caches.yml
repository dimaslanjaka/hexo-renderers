name: Clean GitHub Actions Cache

on:
  # schedule:
  #   - cron: '0 */12 * * *' # Schedule every 12 hours
  push:
    branches:
      - master
  workflow_dispatch:
  workflow_call:
    secrets:
      ACCESS_TOKEN:
        required: true

jobs:
  clean-cache:
    if: contains(github.repository, 'php-proxy-hunter')
    runs-on: windows-latest
    env:
      # Removed Python-related cache envs
      NODE_OPTIONS: '--max_old_space_size=4096' #8192 4096 --expose-gc
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
      YARN_CHECKSUM_BEHAVIOR: update

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          lfs: true

      - name: Update Submodules
        run: |
          echo "init submodules"
          git submodule init
          git submodule foreach "git submodule init"
          echo "sync submodules"
          git submodule sync
          git submodule foreach "git submodule sync"
          echo "update submodules"
          npm install -g rimraf binary-collections@https://raw.githubusercontent.com/dimaslanjaka/bin/master/releases/bin.tgz
          npx rimraf .git/modules
          npx submodule-install
        shell: bash

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup Cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ./dist/
            ./tmp/
            src/*.sqlite*
            src/*.mmdb
            node_modules/
            .yarn/caches/
            .yarn/*.gz
            *.lock
            *.txt
            package-lock.json
            assets/proxies/
            vendor/
            config/
            .cache/
            working.json
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'yarn.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          corepack enable
          yarn install

      - name: Clean github actions cache
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        shell: cmd
        run: |
          npx clean-github-actions-cache
